name: Friday Spotify Release

on:
  schedule:
    # Every Friday at 06:40 UTC (09:40 MSK, avoids top-of-hour cron delays so it finishes by 10:00 MSK)
    - cron: "40 6 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Restore and save Liked Songs artist cache
        uses: actions/cache@v4
        with:
          path: .cache/liked_artists.json
          key: liked-artists-${{ github.run_id }}
          restore-keys: |
            liked-artists-

      - name: Run Friday Drop pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: friday-drop
