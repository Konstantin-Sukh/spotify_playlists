name: Thursday Artist Prompt

on:
  schedule:
    # Every Thursday at 16:00 UTC (19:00 MSK)
    - cron: "0 16 * * 4"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure label exists and create weekly Issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const labelName = "friday-drop";

            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: "1DB954",
                  description: "Weekly Spotify Friday Drop artist requests",
                });
              } else {
                throw error;
              }
            }

            const body = [
              "Привет! Завтра к **10:00 МСК** соберем свежие синглы за последние 6 дней.",
              "",
              "Пришлите в комментариях к этому Issue список релизов (`Артист - Название`).",
              "- ИИ-парсер оставит только синглы (игнорируя альбомы), а агент отберет артистов, у которых есть хотя бы 1 ваш лайкнутый трек в Spotify.",
              "- Если комментариев не будет, Issue закроется автоматически без создания плейлиста.",
            ].join("\n");

            const { data: issue } = await github.rest.issues.create({
              owner,
              repo,
              title: "Пятничный дроп: кого добавляем?",
              body,
              labels: [labelName],
            });

            core.setOutput("issue_url", issue.html_url);

      - name: Send ntfy push notification
        if: env.NTFY_TOPIC != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ISSUE_URL: ${{ steps.create-issue.outputs.issue_url }}
        run: |
          curl -fsS \
            -H "Title: Friday Drop: кого добавляем?" \
            -H "Tags: musical_note,calendar" \
            -H "Click: ${ISSUE_URL}" \
            -d "Открыт еженедельный Issue для выбора артистов: ${ISSUE_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}"
